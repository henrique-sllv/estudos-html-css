<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>4 - audios, videos e imagens dinamicas</title>
</head>
<body>
    <h1>seja bem-vindo ao site prático criado para treinar a adição de imagens dinâmicas, áudios e vídeos</h1>

    <!--seção imagens dinâmicas-->
      <!--com media em tamanho máximo (max-width)-->
        <picture>
            <source media="(max-width: 700px)" srcset="assets/imagens/imagemP.webp" type="image/webp">
            <source media="(max-width: 1050px)" srcset="assets/imagens/imagemM.webp" type="image/webp">
            <img src="assets/imagens/imagemG.webp" alt="imagem flexível">
        </picture>
        <!--com media em tamanho mínimo (min-width)-->
        <picture>
            <source media="(min-width: 1000px)" srcset="assets/imagens/imagemG.webp" type="image/webp">
            <source media="(min-width: 700px)" srcset="assets/imagens/imagemM.webp" type="image/webp">
            <img src="assets/imagens/imagemP.webp" alt="flexível">

        </picture>
        
    <!--seção áudios-->
        <!--forma 1-->
        <h2>adicionando áudios</h2>
        <h3>forma 1</h3>
        <audio src="assets/audios/musica-teste.mpeg" controls loop></audio>
        <!--forma 2-->
        <h3>forma 2</h3>
        <audio preload="metadata" controls loop>
            <source src="assets/audios/musica-teste.mpeg" type="audio/mpeg">
        </audio>

    <!--seção vídeos de forma local-->
        <!--forma 1-->
        <h2>adicionando vídeos</h2>
        <video src="assets/videos/video.mp4" controls></video>
        <!--forma 2-->
        <video controls>
            <source src="assets/videos/video.mp4" type="video/mp4">
        </video>

    <!--seção vídeos de forma online-->
        <h2>adicionando vídeos de forma online</h2>
        <iframe width="560" height="315" src="https://www.youtube.com/embed/UhOTs_qPsy0?si=NIUQYRv_8V6d1uiw" title="YouTube video player" frameborder="0" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share" referrerpolicy="strict-origin-when-cross-origin" allowfullscreen></iframe>
</html>
