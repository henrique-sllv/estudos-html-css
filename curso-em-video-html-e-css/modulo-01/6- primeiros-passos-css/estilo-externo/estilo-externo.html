<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Estilos externos</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <h1>Lista de Abreviações</h1>
    <p>Lista de códigos de formatação</p>
    <ol type="i">
        <li><abbr title="Use [! + tab]">Código base HTML</abbr></li>
        <li><abbr title="Tag [strong]">Texto em negrito</abbr></li>
        <li><abbr title="Tag [em]">Texto em itálico</abbr></li>
        <li><abbr title="Tag [blockquote]">Bloco de citação</abbr></li>
        <li><abbr title="Tag [abbr]">Abreviação</abbr></li>
        <li><abbr title="Tag [mark]">Texto marcado</abbr></li>
        <li><abbr title="Tag [del]">Texto excluído</abbr></li>
        <li><abbr title="Tag [ins]">Texto inserido</abbr></li>
        <li><abbr title="Tag [q]">Citação em linha</abbr></li>
        <li><abbr title="Tag [pre]">Texto pré-formatado</abbr></li>
        <li><abbr title="Tag [code]">Texto de código</abbr></li>
    </ol>

</html>
